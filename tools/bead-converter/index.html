<html lang="zh-CN">

<meta charset="UTF-8">

<title>拼豆色号转换器 · by 小克</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #faf9f7;
    font-family: 'Helvetica Neue', 'PingFang SC', -apple-system, sans-serif;
    padding: 32px 16px;
    color: #2d2d2d;
  }
  .container { max-width: 600px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 32px; }
  .dots { display: flex; justify-content: center; gap: 4px; margin-bottom: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #999; }
  .author { font-size: 11px; color: #bbb; margin-top: 4px; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 24px 20px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.04);
    margin-bottom: 20px;
  }
  .label {
    font-size: 12px;
    color: #888;
    display: block;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .brand-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #e0e0e0;
    background: #fff;
    color: #555;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .brand-btn.active {
    border: 2px solid #2d2d2d;
    background: #2d2d2d;
    color: #fff;
    font-weight: 600;
  }
  textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #e8e8e8;
    font-size: 15px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    resize: none;
    outline: none;
    background: #fafafa;
    margin-bottom: 16px;
  }
  textarea:focus { border-color: #ccc; }
  .convert-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #2d2d2d;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    font-family: inherit;
    transition: background 0.2s;
  }
  .convert-btn:hover { background: #444; }
  .results-label { font-size: 12px; color: #888; margin-bottom: 16px; letter-spacing: 0.5px; }
  .result-item {
    border-radius: 10px;
    border: 1px solid #eee;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .result-item.not-found {
    border-color: #f5d0d0;
  }
  .not-found-inner {
    padding: 14px 16px;
    background: #fef5f5;
    color: #c44;
    font-size: 13px;
  }
  .not-found-inner code { font-weight: 600; }
  .result-row { display: flex; align-items: stretch; }
  .color-swatch {
    width: 52px;
    min-height: 80px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .color-swatch span {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    writing-mode: vertical-lr;
    letter-spacing: 2px;
  }
  .info-grid {
    flex: 1;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 16px;
    font-size: 13px;
    background: #fafafa;
  }
  .info-cell {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .info-cell.dimmed { opacity: 0.5; }
  .info-cell .brand-name { color: #999; font-size: 11px; }
  .info-cell .code-val {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-weight: 600;
    font-size: 13px;
  }
  .footer {
    text-align: center;
    font-size: 11px;
    color: #bbb;
    margin-top: 24px;
    line-height: 1.8;
  }
  .footer a { color: #aaa; text-decoration: none; }
</style>
</head>

const BRANDS = [
  { key:"m", label:"MARD" },
  { key:"c", label:"COCO" },
  { key:"mm", label:"漫漫" },
  { key:"pp", label:"盼盼" },
  { key:"mx", label:"咪小窝" },
];

const MARD_COLORS = {
  A:"#f5a623",B:"#d94f5c",C:"#8b2252",D:"#7b5ea7",
  E:"#3a7bd5",F:"#2eaa5e",G:"#2bb5a0",H:"#f2d75e",
  M:"#f7c948",P:"#e88cb4",Q:"#888",R:"#6b4c3b",
  S:"#c0c0c0",T:"#8b7355",Y:"#ffd700",Z:"#66b3cc",
};

function getColor(mard) {
  if (!mard) return "#ddd";
  const prefix = mard.replace(/[0-9]/g,"");
  if (prefix === "ZG") return "#999";
  return MARD_COLORS[prefix] || "#ddd";
}

// Build lookup tables
const lookup = {};
BRANDS.forEach(b => {
  lookup[b.key] = {};
  DATA.forEach(row => {
    const val = row[b.key];
    if (val) {
      const key = val.toUpperCase().trim();
      if (!lookup[b.key][key]) lookup[b.key][key] = [];
      lookup[b.key][key].push(row);
    }
  });
});

let currentBrand = "c";

const placeholders = {
  m: "例：A1, A10, B1",
  c: "例：E02, D07, F05",
  mm: "例：E2, B12, C1",
  pp: "例：65, 89, 48",
  mx: "例：77, 96, 48",
};

function initBrands() {
  const container = document.getElementById("brandBtns");
  container.innerHTML = "";
  BRANDS.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "brand-btn" + (b.key === currentBrand ? " active" : "");
    btn.textContent = b.label;
    btn.onclick = () => {
      currentBrand = b.key;
      document.getElementById("inputText").placeholder = placeholders[b.key] || "";
      initBrands();
    };
    container.appendChild(btn);
  });
}

function doConvert() {
  const inputText = document.getElementById("inputText").value;
  const codes = inputText
    .split(/[,，/\s、]+/)
    .map(s => s.trim().toUpperCase())
    .filter(Boolean);

  const results = codes.map(code => {
    const matches = lookup[currentBrand]?.[code];
    if (matches && matches.length > 0) return { code, found: true, rows: matches };
    return { code, found: false, rows: [] };
  });

  renderResults(results);
}

function renderResults(results) {
  const container = document.getElementById("resultsContainer");
  if (results.length === 0) { container.innerHTML = ""; return; }

  const brandLabel = BRANDS.find(b => b.key === currentBrand)?.label || "";

  let html = `<div class="card">
    <p class="results-label">转换结果 · ${results.length} 个色号</p>`;

  results.forEach(r => {
    if (!r.found) {
      html += `<div class="result-item not-found">
        <div class="not-found-inner">${brandLabel} <code>${r.code}</code> — 未找到</div>
      </div>`;
    } else {
      r.rows.forEach(row => {
        const col = getColor(row.m);
        html += `<div class="result-item"><div class="result-row">
          <div class="color-swatch" style="background:${col}">
            <span>${row.m}</span>
          </div>
          <div class="info-grid">`;
        BRANDS.forEach(b => {
          const dimmed = b.key === currentBrand ? " dimmed" : "";
          html += `<div class="info-cell${dimmed}">
            <span class="brand-name">${b.label}</span>
            <span class="code-val">${row[b.key]}</span>
          </div>`;
        });
        html += `</div></div></div>`;
      });
    }
  });

  html += `</div>`;
  container.innerHTML = html;
}

// Enter key support
document.addEventListener("DOMContentLoaded", () => {
  initBrands();
  document.getElementById("inputText").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      doConvert();
    }
  });
});
